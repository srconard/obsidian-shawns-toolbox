name: Release Obsidian Plugin

# Builds the plugin and attaches main.js + manifest.json + styles.css to the
# release. This exists because v1.2.0 was cut by hand with no assets attached,
# which silently froze BRAT on 1.1.1 — BRAT installs from release assets, so a
# bare tag looks like "no update available" rather than an error.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -f main.js || { echo "::error::main.js missing — refusing to cut an asset-less release"; exit 1; }
          test -f manifest.json || { echo "::error::manifest.json missing"; exit 1; }
          test -f styles.css || { echo "::error::styles.css missing"; exit 1; }
          ls -la main.js manifest.json styles.css

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "${TAG#v}" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ${TAG} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "tag ${TAG} matches manifest ${MANIFEST_VERSION}"

      - name: Create release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            main.js manifest.json styles.css
